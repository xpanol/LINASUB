<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kolekcja Okładek - Szablon 8x3</title>

  <style>
    /* Reset i style globalne */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
    font-family: "Special Elite", cursive;
    background-color: #ffffff;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
}

a {
    font-family: inherit;
}
    /* SIATKA: Dokładnie 3 kolumny w rzędzie */
    .covers-grid {
      display: grid;
      grid-template-columns: repeat(3, 250px); /* 3 kolumny po 250px szerokości */
      gap: 50px 60px; /* Wyraźne odstępy: 50px w pionie, 60px w poziomie */
      max-width: 900px;
    }

    /* Pojedyncza karta okładki */
    .cover-card {
      display: flex;
      flex-direction: column; 
      align-items: center;    
      cursor: pointer;
    }

    /* Styl Twojego logo wewnątrz okładki */
    .my-logo {
      width: 200px; 
      height: auto;
      display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    /* Styl tytułu pod okładką */
    .cover-title {
      display: block;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      
      /* USUNIĘTO !important STĄD, żeby hover mógł zadziałać */
      color: #333333; 
      
      transition: color 0.3s ease;
    }

    /* --- HOVER (EFEKTY PO NAJECHANIU NA KARTĘ) --- */

    /* 1. Logo */
    .cover-card:hover .my-logo,
    .cover-card:hover .my-logo path {
      transform: translateY(-8px);
      fill: #F8AC10 !important;
    } /* <-- KLAMRA ZAMYKAJĄCA LOGO */

    /* 2. Zmiana koloru tytułu */
    .cover-card:hover .cover-title {
      color: #F8AC10 !important; 
    }
    a {
    font-family: "Special Elite", sans-serif;
}
  </style>
